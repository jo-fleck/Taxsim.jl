name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Nightly is informational: a Base change should not gate a pull request.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No `arch` axis: setup-julia v3 errors when x64 is requested on an aarch64 macOS
        # runner, and macos-latest is Apple Silicon.
        version: ['lts', '1']
        os: [ubuntu-latest, windows-latest]
        include:
          # 'min' resolves the floor declared in [compat], which is the only thing that
          # actually proves julia = "1.10" is honest.
          - version: 'min'
            os: ubuntu-latest
          - version: '1'
            os: macOS-latest
          - version: 'nightly'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          project: '.'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        # The suite runs offline against recorded fixtures. Tests that need NBER are gated
        # behind TAXSIM_LIVE_TESTS and run in the scheduled canary workflow instead, because
        # a hosted runner reaching NBER over SSH is not something to gate a PR on.
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info            # `file:` has been ignored since v4
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run doctests
        run: |
          julia --project=docs -e '
            using Documenter, Taxsim
            DocMeta.setdocmeta!(Taxsim, :DocTestSetup, :(using Taxsim); recursive=true)
            doctest(Taxsim)'
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
