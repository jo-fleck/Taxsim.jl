name: Canary

# Runs the live tests against NBER's servers on a schedule rather than on every push.
#
# The recorded fixtures pin TAXSIM's current response layout. NBER rebuilds these binaries
# without changing the version number, so offline tests can stay green indefinitely while the
# package is quietly wrong against the live service. This job is the only thing that would
# notice. It is deliberately not part of CI: a hosted runner reaching NBER over SSH will
# occasionally fail for reasons that have nothing to do with a pull request.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  live:
    name: Live TAXSIM round trip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          project: '.'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the live suite
        env:
          TAXSIM_LIVE_TESTS: 'true'
        run: julia --project=. -e 'using Pkg; Pkg.test()' 2>&1 | tee canary.log
      - name: Open an issue if the live service changed
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Live TAXSIM canary failed"
          content-filepath: canary.log
          labels: canary
